plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

// Release signing (5.6): the upload key's settings are read from the properties file CCH_RELEASE_KEYS names
// (storeFile, storePassword, keyAlias, keyPassword), kept outside the repository. Without it the release APK is
// built unsigned, as on CI.
def releaseKeysPath = System.getenv('CCH_RELEASE_KEYS')
def releaseKeys = new Properties()
def hasReleaseKeys = releaseKeysPath != null && file(releaseKeysPath).exists()
if (hasReleaseKeys) {
    file(releaseKeysPath).withReader('UTF-8') { reader -> releaseKeys.load(reader) }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def supabaseUrl = localProperties.getProperty('supabase.url', 'https://placeholder-coldchain.supabase.co')
def supabaseAnonKey = localProperties.getProperty('supabase.anon.key', 'placeholder-anon-key')

// Live tests need a target named explicitly, so they can never pick one up from local.properties.
def liveSupabaseUrl = System.getenv('CCH_LIVE_SUPABASE_URL')
def liveTestsEnabled = liveSupabaseUrl && System.getenv('CCH_LIVE_SUPABASE_KEY')
if (liveSupabaseUrl?.toLowerCase()?.contains('ljqwaqesiszczixbclwg')) {
    throw new GradleException('Live tests must never run against the demo project.')
}

// A debug build can be pointed somewhere else for one build, such as the local stack for a rehearsal, without
// editing local.properties. Release builds never take it.
def debugAppUrl = System.getenv('CCH_APP_SUPABASE_URL')
def debugAppKey = System.getenv('CCH_APP_SUPABASE_KEY')
if (debugAppUrl?.toLowerCase()?.contains('ljqwaqesiszczixbclwg') || supabaseUrl.toLowerCase().contains('ljqwaqesiszczixbclwg')) {
    throw new GradleException('The app must never be built against the demo project.')
}
// That check is a tripwire on the project ref, not a control: a custom domain in front of the demo project passes it.

// Whatever goes into BuildConfig ships inside the APK (security review S6). The values are pasted into Java source,
// so they must be plain, and the only key an app may hold is a publishable (anon) one. Messages never show a value.
def refuseUnsafeAppValue = { String name, String value ->
    if (value != null && (value.contains('"') || value.contains('\\'))) {
        throw new GradleException("$name contains a quote or a backslash.")
    }
}
def refuseSecretKey = { String name, String key ->
    if (!key) return
    refuseUnsafeAppValue(name, key)
    def secret = key.startsWith('sb_secret_')
    def parts = key.split('\\.')
    if (!secret && parts.length == 3) {
        try {
            def payload = new String(Base64.urlDecoder.decode(parts[1].replace('=', '')), 'UTF-8')
            secret = payload.replaceAll('\\s', '').contains('"role":"service_role"')
        } catch (IllegalArgumentException ignored) {
            // Not a JWT: nothing more to check.
        }
    }
    if (secret) throw new GradleException("$name is a secret key. An app may only hold a publishable (anon) key.")
}
refuseUnsafeAppValue('supabase.url', supabaseUrl)
refuseSecretKey('supabase.anon.key', supabaseAnonKey)
refuseUnsafeAppValue('CCH_APP_SUPABASE_URL', debugAppUrl)
refuseSecretKey('CCH_APP_SUPABASE_KEY', debugAppKey)

android {
    namespace = 'com.coldchain.handshake'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.coldchain.handshake"
        minSdk = 26
        targetSdk = 36
        // 0.<phase>.<patch> while a prototype; the code is the same number written as major*10000 + minor*100 + patch.
        versionCode = 500
        versionName = "0.5.0"

        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    signingConfigs {
        if (hasReleaseKeys) {
            release {
                storeFile = file(releaseKeys.getProperty('storeFile'))
                storePassword = releaseKeys.getProperty('storePassword')
                keyAlias = releaseKeys.getProperty('keyAlias')
                keyPassword = releaseKeys.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeys) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix = ".debug"
            debuggable = true
            if (debugAppUrl && debugAppKey) {
                buildConfigField "String", "SUPABASE_URL", "\"${debugAppUrl}\""
                buildConfigField "String", "SUPABASE_ANON_KEY", "\"${debugAppKey}\""
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    lint {
        // This rule only looks at property files, and the only one with a Windows path is the untracked
        // local.properties, so it would fail on each developer's machine and never on CI.
        disable += 'PropertyEscape'
    }

    sourceSets {
        // Robolectric sees the variant's merged assets, not the test source set's.
        debug.assets.directories.add('schemas')
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { test ->
            if (liveTestsEnabled) {
                // The guard below is off for this run, so nothing except the live test may run in it.
                test.filter.includeTestsMatching '*LiveSupabaseIntegrationTest'
            } else {
                test.filter.excludeTestsMatching '*LiveSupabaseIntegrationTest'
                // A dead proxy, so a unit test can't reach a real server by accident. It stops mistakes,
                // not intent: code that asks for Proxy.NO_PROXY still gets out. Maven Central is the one
                // exception, because Robolectric downloads its Android jars from there.
                test.systemProperty 'http.proxyHost', '127.0.0.1'
                test.systemProperty 'http.proxyPort', '9'
                test.systemProperty 'https.proxyHost', '127.0.0.1'
                test.systemProperty 'https.proxyPort', '9'
                test.systemProperty 'socksProxyHost', '127.0.0.1'
                test.systemProperty 'socksProxyPort', '9'
                test.systemProperty 'http.nonProxyHosts', 'repo1.maven.org'
                test.systemProperty 'socksNonProxyHosts', 'repo1.maven.org'
            }
        }
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas".toString())
}

dependencies {
    implementation project(':core-domain')

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    
    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    
    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.10.2'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Serialization
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'

    // Supabase & Ktor
    implementation platform('io.github.jan-tennert.supabase:bom:3.8.0')
    implementation 'io.github.jan-tennert.supabase:postgrest-kt'
    implementation 'io.github.jan-tennert.supabase:auth-kt'
    implementation 'io.github.jan-tennert.supabase:realtime-kt'
    // OkHttp, because Realtime needs WebSockets. The version matches the one supabase-kt is built with.
    implementation 'io.ktor:ktor-client-okhttp:3.5.1'

    // Room
    def room_version = "2.8.5"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    
    // QR & Camera (nuekkis reference adaptation)
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.zxing:core:3.5.4'

    // Background work
    implementation 'androidx.work:work-runtime-ktx:2.12.0'

    // Dependency injection (DECISIONS.md, 23 Nov 2026)
    def hilt_version = "2.60.1"
    def androidx_hilt_version = "1.4.0"
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-compiler:$hilt_version"
    implementation "androidx.hilt:hilt-lifecycle-viewmodel-compose:$androidx_hilt_version"
    implementation "androidx.hilt:hilt-work:$androidx_hilt_version"
    ksp "androidx.hilt:hilt-compiler:$androidx_hilt_version"
    testImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
    kspTest "com.google.dagger:hilt-compiler:$hilt_version"

    // Foreground Location Provider
    implementation 'com.google.android.gms:play-services-location:21.4.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.work:work-testing:2.12.0'
    testImplementation testFixtures(project(':core-domain'))
    testImplementation 'io.ktor:ktor-client-mock:3.5.1'
    testImplementation platform('androidx.compose:compose-bom:2026.09.00')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}


