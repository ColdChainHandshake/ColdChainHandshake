name: CI

on:
  push:
    branches: [main, 'rebuild/**']
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      # testReleaseUnitTest and assembleRelease prove that release builds without the debug tools.
      - name: Unit tests, lint and release build
        run: ./gradlew testDebugUnitTest testReleaseUnitTest lintDebug assembleRelease --continue

      # Room rewrites these files during the build, so a difference means the schema changed
      # without being committed.
      - name: Committed Room schemas are current
        run: git diff --exit-code -- app/schemas

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      - name: Start local Postgres
        run: supabase db start

      - name: Database tests
        run: supabase test db

      - name: Security advisors
        run: supabase db advisors --local --fail-on error
