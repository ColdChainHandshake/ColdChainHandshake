name: CI

on:
  push:
    branches: [main, 'rebuild/**']
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      # testReleaseUnitTest and assembleRelease prove that release builds without the debug tools.
      - name: Unit tests, lint and release build
        run: ./gradlew :core-domain:test testDebugUnitTest testReleaseUnitTest lintDebug assembleRelease --continue

      # Room rewrites these files during the build, so a difference means the schema changed
      # without being committed.
      - name: Committed Room schemas are current
        run: git diff --exit-code -- app/schemas

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Ninja and clang
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      # The logger's host library against docs/protocol/logger_vectors.json, the vectors the app's tests use too.
      - name: Host tests (g++)
        working-directory: firmware
        run: cmake --preset host-tests && cmake --build --preset host-tests && ctest --preset host-tests

      - name: Host tests with AddressSanitizer and UBSan (clang)
        working-directory: firmware
        run: cmake --preset asan-ubsan && cmake --build --preset asan-ubsan && ctest --preset asan-ubsan

      - name: Fuzz both decoders for 30 seconds each (clang, libFuzzer)
        working-directory: firmware
        run: |
          cmake --preset fuzz && cmake --build --preset fuzz
          ./build/fuzz/fuzz_record_decode -max_total_time=30
          ./build/fuzz/fuzz_history_request -max_total_time=30

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 3.3.0   # keep equal to package.json

      - name: Start local Postgres
        run: supabase db start

      - name: Database tests
        run: supabase test db

      - name: Security advisors
        run: supabase db advisors --local --fail-on error
